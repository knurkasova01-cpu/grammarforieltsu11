{id:'B1',type:'info',t:'B · Grammar 1: Comparing adjectives',q:'',html:`<table><tr><th>adjective</th><th>comparative</th><th>superlative</th></tr>
<tr><td>one syllable: <i>hard</i></td><td>adjective + <i>-er</i>: <i>harder</i></td><td><i>the</i> + adjective + <i>-est</i>: <i>the hardest</i></td></tr>
<tr><td>one syllable ending in <i>-e</i>: <i>nice</i></td><td>adjective + <i>-r</i>: <i>nicer</i></td><td><i>the</i> + adjective + <i>-st</i>: <i>the nicest</i></td></tr>
<tr><td>one syllable ending in vowel + consonant: <i>fat</i></td><td>adjective with last consonant doubled + <i>er</i>: <i>fatter</i></td><td><i>the</i> + adjective + consonant doubled + <i>-est</i>: <i>the fattest</i></td></tr>
<tr><td>two syllables ending in <i>-y</i>: <i>happy</i></td><td>adjective <i>-y</i> + <i>ier</i>: <i>happier</i></td><td><i>the</i> + adjective <i>-y</i> + <i>iest</i>: <i>the happiest</i></td></tr>
<tr><td>two or more syllables: <i>enjoyable</i></td><td><i>more</i> + adjective: <i>more enjoyable</i></td><td><i>the most</i> + adjective: <i>the most enjoyable</i></td></tr>
<tr><td>Irregular: <i>good, bad, far</i></td><td><i>better, worse, further/farther</i></td><td><i>the best, the worst, the furthest/farthest</i></td></tr></table>
<h3>Comparative adjectives</h3><p>We use comparative adjectives to compare two or more things, people or places:</p><p class=ex>Younger runners will always be <b>faster</b> than older runners.</p>
<p>or the same thing, person or place at two different times:</p><p class=ex>I’m much <b>fitter</b> than I was last year.</p>
<p>We use <i>than</i> after comparative adjectives to say what we are comparing something with. Sometimes we leave out the <i>than</i>-clause if it is clear from the context what we are comparing something with:</p><p class=ex>Older athletes are getting <b>faster and fitter</b>. (than in the past)</p>
<h3>Superlative adjectives</h3><p>We use superlative adjectives to compare one thing in a group with all the others in that group:</p><p class=ex>The Olympics is probably <b>the most exciting</b> sports event in the sports calendar.</p>
<p>We can modify superlatives with</p><ul><li><i>one of the / some of the</i> + superlative + plural noun:</li></ul><p class=ex>It’s one of the few chances we get to see <b>some of the best athletes</b> in the world competing against each other.<br>Tamsin is <b>one of the most generous people</b> I know.</p>
<ul><li>ordinal numbers:</li></ul><p class=ex>Our team was <b>the third best</b> in the competition.</p>
<p>We can replace <i>the</i> with a possessive:</p><p class=ex><b>my</b> best friend<br><b>his</b> greatest achievement</p>`},
{id:'B2',type:'info',t:'B · Grammar 2: Comparing adverbs',q:'',html:`<p>We can compare how things are done by using <i>more/most</i> + adverb:</p><p class=ex>Runners aged 50 and over are speeding up <b>more rapidly</b> than younger people.<br>Women aged 60 to 68 improved <b>the most markedly</b>.</p>
<p>Adverbs that have the same form as the adjective (e.g. <i>hard, fast, straight, late, early, quick</i>) add <i>-er/-est</i>:</p><p class=ex>Women aged 60 to 68 run on average four minutes <b>faster</b> each year.</p>
<p>There are some irregular adverbs (e.g. <i>well, better, best; badly, worse, worst; far, further, furthest; little, less, least</i>):</p><p class=ex>I did <b>worse</b> than I had expected in the exam, so I was disappointed.</p>`},
{id:'B3',type:'info',t:'B · Grammar 3: Other ways of comparing',q:'',html:`<p>We use <i>less/the least</i> to mean the opposite of <i>more/the most</i>:</p><p class=ex>You might imagine that the Masters Games would be <b>less exciting</b> to watch.<br>That was probably <b>the least enjoyable</b> meal I’ve ever had!</p>
<h3>We can add emphasis</h3><ul><li>with words like <i>even, far, a great deal, a little, a lot, much</i> + comparative:</li></ul><p class=ex>Older women showed <b>much greater</b> increases in speed than expected.</p>
<ul><li>in formal English with words like <i>slightly, considerably, significantly</i> + comparative:</li></ul><p class=ex>The figures for 2003 were <b>significantly higher</b> than those for the year 2000.<br>The number of women in higher education was <b>only slightly lower</b> than the number of men.</p>
<p class=warn>⚠ We cannot use <i>very</i> with comparatives (not <s>the number of women was very lower</s>).</p>
<h3>The same or similar</h3><p>We can say two things are the same or similar with <i>as</i> + adjective/adverb + <i>as</i>:</p><p class=ex>My car is <b>as old as</b> yours. (= the two cars are the same age)<br>Older athletes are <b>as likely</b> to achieve their peak fitness <b>as</b> younger athletes. (= they have the same chance of achieving this)</p>
<p>We can add to the meaning by using <i>just, almost, nearly, half, twice, three times</i> etc.:</p><p class=ex>In 2005, our team was <b>almost as successful as</b> in 2003.<br>He can run <b>twice as fast as</b> the others in his team.</p>
<h3>Different</h3><p>We can say two things are different with <i>not as</i> + adjective/adverb + <i>as</i>:</p><p class=ex>While they may <b>not be as fast as</b> their younger counterparts ...</p>
<h3>Change over time</h3><p>We can show that a change is happening over time by repeating the comparative:</p><p class=ex>Each year athletes seem to be getting <b>better and better</b>.<br>Our atmosphere is gradually becoming <b>more and more polluted</b>.<br>It seems <b>less and less likely</b> that there will be a general election this year.</p>
<p>We use <i>the</i> + comparative + <i>the</i> + comparative to show that two things vary or change at the same time:</p><p class=ex>It would seem that <b>the longer</b> athletes keep competing <b>the greater</b> their chances of setting new records are.<br><b>The sooner the better.</b></p>`},
{id:'B4',type:'info',t:'B · Grammar 4: Comparing quantities',q:'',html:`<table><tr><th>quantifier</th><th>comparative</th><th>superlative</th></tr>
<tr><td><i>a lot / much / many</i></td><td><i>more</i></td><td><i>the most</i></td></tr>
<tr><td><i>a few</i></td><td><i>fewer</i> (+ plural countable noun)</td><td><i>the fewest</i> (+ plural countable noun)</td></tr>
<tr><td><i>a little</i></td><td><i>less</i> (+ uncountable noun)</td><td><i>the least</i> (+ uncountable noun)</td></tr></table>
<p>For plural or uncountable nouns we can compare quantities with <i>more</i> or <i>most</i>:</p><p class=ex>Today’s top sportspeople receive a lot <b>more money</b> than in the past.</p>
<p>We can use <i>fewer</i> or <i>the fewest</i> with plural countable nouns, and <i>less</i> or <i>the least</i> with uncountable nouns:</p><p class=ex>25 years ago few 60-year-old men and even <b>fewer women</b> would have considered running a marathon.<br>There used to be <b>less information</b> available about fitness.</p>
<h3>We can add emphasis</h3><ul><li>with <i>a lot / many + more / fewer</i> + plural countable noun:</li></ul><p class=ex>Increased sponsorship has given today’s athletes <b>many more opportunities</b> to succeed.</p>
<ul><li>with <i>a lot / much + more / less</i> + uncountable noun:</li></ul><p class=ex>Today’s athletes need to do <b>much more training</b> than in the past.</p>
<ul><li>by repeating <i>more/less/fewer</i>:</li></ul><p class=ex>So much in our society is about making <b>more and more money</b>.</p>
<p>We can say something is the same or different using (<i>not</i>) <i>as many/much</i> + plural/uncountable noun (+ <i>as</i>):</p><p class=ex>There <b>aren’t as many people</b> doing sports at school (as there used to be).</p>
<p>We can add more specific information about quantity by using <i>half, twice, three times</i> etc. with <i>as many/much ... as</i>:</p><p class=ex>In 2004 China won nearly <b>twice as many</b> silver medals <b>as</b> the US.<br>The US won more than <b>three times as many</b> medals <b>as</b> Great Britain.</p>
<h3>Grammar extra: Comparing nouns</h3><p>We can compare how similar things are using <i>like, the same (as), similar to</i>:</p><p class=ex>Older athletes can achieve <b>the same</b> degree of physical improvement <b>as</b> those in their twenties and thirties.<br>He swims <b>like</b> a fish.<br>This film is <b>similar to</b> this director’s last one.</p>`},

{id:'D1',type:'write',img:'d1-hours-chart',t:'D · Test practice: Academic Writing Task 1',q:'You should spend about 20 minutes on this task. Write at least 150 words.',note:`<b>The chart below shows the average hours worked per day by married men and women in paid employment.</b> Summarise the information by selecting and reporting the main features, and make comparisons where relevant.`,model:`<p><b>Test tip:</b> Make sure you read all of the information provided very carefully. Look at the statistical information you are given and choose the most important features. Look for data which is the same or similar and features which show important differences or changes.</p><p><b>Model answer</b></p><p>The chart provides a summary of the average number of hours married men and women work every day both inside and outside of the home. In both age groups shown, the total number of hours worked by married women is greater than the total number of hours worked by men. Whilst women aged 45 to 64 may work fewer hours inside the home, they work the greatest number of hours per day due to the extra hours of paid work that they do.</p><p>Men aged 25 to 44 spend only slightly more time working outside of the home than men aged 45 to 64, but this figure is significantly higher than the number of hours of paid work that women of the same age do.</p><p>Women in the 25 to 44 age group work almost as many hours inside the home as outside, and there is only a slight difference in the 45 to 64 age group. However, men work on average three times longer outside of the home than inside.</p>`},

'4 Women in the 25 to 44 age group work almost {4} <span class=hint>(many)</span> hours inside the home as outside, and there is only a slight difference in the 45 to 64 age group.',
'5 However, men work on average {5} <span class=hint>(three/long)</span> outside the home than inside.'],
ans:{'1':['greater than'],'2a':['fewer'],'2b':['the greatest'],'3a':['slightly more'],'3b':['significantly higher than'],'4':['as many'],'5':['three times longer']}},
{id:'Finish',type:'finish',t:'Finish · Submit your answers',q:''}
];
const res={};let who={};let cur=0;
function nav(){$('#nav').innerHTML=E.map((e,i)=>`<button class="tab${i==cur?' on':''}" onclick="go(${i})">${e.id}</button>`).join('')}
function go(i){cur=i;nav();draw()}
const R={
sort:e=>e.items.map((s,i)=>`<div class=row id=r${i}><span class=t>${s}</span><button class="opt" data-g=g${i}>Young athletes</button><button class="opt" data-g=g${i}>Older athletes</button></div>`).join(''),
tf:e=>e.items.map((it,i)=>`<div class=row id=r${i}><span class=t>${i+1} ${it[0]}</span><button class=opt data-g=g${i} data-v=1>True</button><button class=opt data-g=g${i} data-v=0>False</button><input type=text class=w placeholder="Correction (if false)"></div>`).join(''),
multi:e=>`<p>${[1,2,3,4,5].map(n=>'').join('')}</p>`+e.qs.map((q,i)=>`<div class=row id=r${i}><span class=t style="flex-basis:100%">${q[0]}</span>${q[1].map(o=>`<button class=opt data-m=1 data-v="${o}">${o}</button>`).join('')}<span class=note hidden>${q[3]}</span></div>`).join(''),
info:e=>`<div class=g>${e.html}</div>`,
finish:e=>`<p>Check that you have done every exercise, then press <b>Submit answers</b>.</p><ul>${E.filter(x=>x.type!='info'&&x.type!='finish').map(x=>`<li>${x.id}: ${res[x.id]?'✅ done':'⬜ not done yet'}</li>`).join('')}</ul><button class=pri onclick=fin()>Submit answers</button><div id=out hidden><p>Press <b>Copy</b>, then paste your results into the WhatsApp chat with your teacher.</p><textarea class=o id=txt rows=12 readonly></textarea><div class=bar><button class=pri onclick=cp()>Copy</button><button onclick="window.open('https://wa.me/?text='+encodeURIComponent($('#txt').value))">Open WhatsApp</button><span id=cs></span></div></div>`,
write:e=>`<div class=ref>${e.note}</div><textarea id=w rows=10 style="width:100%;font:inherit;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);box-sizing:border-box"></textarea><div class=ref id=model hidden>${e.model}</div>`,
gap:e=>(e.ref?`<div class=ref>${e.ref}</div>`:'')+e.lines.map(l=>`<p class=ln>${l.replace(/\{(\w+)\}/g,(m,k)=>`<input type=text data-k="${k}" autocomplete=off autocapitalize=off spellcheck=false class="${e.sz=='w'?'w':''}" value="${(e.pre&&e.pre[k])||''}">`)}</p>`).join('')};
function draw(){const e=E[cur];$('#main').innerHTML=`<h2>${e.t}</h2><p class=q>${e.q}</p>`+(e.img?`<img src="images/${e.img}.png" alt="">`:'')+(e.audio?`<audio controls src="audio/track-11.mp3"></audio>`:'')+(e.bank?`<div class=bank>${e.bank.map(w=>`<span>${w}</span>`).join('')}</div>`:'')+(e.id=='A4'?`<div class=ref>1 Older athletes are getting faster and fitter. 2 Runners aged 50+ are speeding up less rapidly than young runners. 3 …run on average two minutes faster each year. 4 Older athletes are less likely to achieve their peak fitness than younger athletes. 5 People grow weaker because they are less active than when they were younger.</div>`:'')+R[e.type](e)+(['info','finish'].includes(e.type)?'':`<div class=bar><button class=pri onclick=sub()>Submit</button><button onclick=draw()>Try again</button><span id=sc></span></div>`)}
document.addEventListener('click',ev=>{const b=ev.target.closest('.opt');if(!b)return;if(b.dataset.m){b.classList.toggle('on');return}$$(`.opt[data-g="${b.dataset.g}"]`).forEach(x=>x.classList.remove('on'));b.classList.add('on')});
function sub(){const e=E[cur];let ok=0,n=0,bad=[];
if(e.type=='write'){const w=$('#w').value.trim().split(/\s+/).filter(Boolean).length;$('#sc').textContent=w+' words';res[e.id]={w,text:$('#w').value.trim()};$('#model').hidden=false;return}
if(e.type=='sort'){res[e.id]={done:1};$('#sc').textContent='Answers saved – now listen and check (Ex. 2).';return}
if(e.type=='gap'){$$('#main input[data-k]').forEach(inp=>{inp.nextElementSibling?.classList.contains('fix')&&inp.nextElementSibling.remove();const a=e.ans[inp.dataset.k],g=a.some(x=>nz(x)==nz(inp.value));n++;g&&ok++;!g&&bad.push(inp.dataset.k+': '+(inp.value.trim()||'–'));inp.className=(g?'ok':'bad')+(inp.classList.contains('w')?' w':'');if(!g)inp.insertAdjacentHTML('afterend',`<span class=fix>✓ ${a[0]}</span>`)})}
if(e.type=='tf')e.items.forEach((it,i)=>{const r=$('#r'+i),s=r.querySelector('.opt.on'),g=s&&s.dataset.v==it[1];n++;g&&ok++;r.className='row '+(g?'ok':'bad');r.querySelectorAll('.opt').forEach(o=>{o.classList.toggle('right',o.dataset.v==it[1]);});if(!it[1]&&!r.querySelector('.note'))r.insertAdjacentHTML('beforeend',`<span class=note>✓ ${it[2]}</span>`)});
if(e.type=='multi')e.qs.forEach((q,i)=>{const r=$('#r'+i),sel=[...r.querySelectorAll('.opt.on')].map(x=>x.dataset.v),g=sel.length==q[2].length&&q[2].every(x=>sel.includes(x));n++;g&&ok++;r.className='row '+(g?'ok':'bad');r.querySelectorAll('.opt').forEach(o=>{o.classList.toggle('right',q[2].includes(o.dataset.v));o.classList.toggle('wrong',o.classList.contains('on')&&!q[2].includes(o.dataset.v))});r.querySelector('.note').hidden=false});
res[e.id]={ok,n,bad};$('#sc').textContent=`Score: ${ok} / ${n}`}
function fin(){let t=`Unit 11 – Comparing things\nName: ${who.n}\nGroup: ${who.g}\nDate: ${new Date().toLocaleDateString()}\n`;
E.forEach(x=>{if(x.type=='info'||x.type=='finish')return;const r=res[x.id];t+='\n'+x.id+': '+(!r?'not done':r.text!==undefined?r.w+' words\n'+r.text:r.n?r.ok+'/'+r.n+(r.bad.length?' | wrong: '+r.bad.join('; '):''):'done')});
$('#txt').value=t;$('#out').hidden=false;$('#cs').textContent=''}
function cp(){const t=$('#txt'),d=()=>$('#cs').textContent='Copied ✓ Now paste it into WhatsApp';t.select();t.setSelectionRange(0,99999);try{navigator.clipboard.writeText(t.value).then(d,()=>{document.execCommand('copy');d()})}catch(x){document.execCommand('copy');d()}}
function begin(){const n=$('#sn').value.trim(),g=$('#sg').value.trim();if(!n||!g){$('#se').textContent='Please enter your name and group number.';return}who={n,g};$('.sub').textContent=n+' · Group '+g;go(0)}
$('#main').innerHTML=`<div class=start><h2>Welcome</h2><p>Enter your name and group number to begin.</p><label for=sn>Your name</label><input type=text id=sn autocomplete=name><label for=sg>Group number</label><input type=text id=sg><p id=se class=fix style="color:var(--bad)"></p><button class=pri onclick=begin()>Start</button></div>`;
</script></body></html>
